[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volumeviewer"
version = "0.1.0"
description = "3D Volume viewer for microscopy data"
requires-python = ">=3.11"
dependencies = [
    "numpy<2.3.0",
    "PyOpenGL",
    "glfw",
    "PyGLM",
    "tifffile>=2026",
    "tkinterdnd2",
    "dask",
    "zarr",
    "imagecodecs"
]

[project.scripts]
volumeviewer = "volumeviewer.main:main"

[tool.setuptools.packages.find]
where = ["src"]
